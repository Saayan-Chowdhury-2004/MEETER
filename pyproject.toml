[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-agent"
version = "0.1.0"
description = "Local third-person meeting observer agent (local-first, Windows-first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Meeting Agent" }]
dependencies = [
  "pydantic>=2.5,<3",
  "PyYAML>=6.0",
  "mss>=9.0",
  "opencv-python>=4.8",
  "numpy>=1.24,<3",
  "paddleocr>=2.7",
  "Pillow>=10.0",
  "pygetwindow>=0.0.9",
  "psutil>=5.9",
]

[project.optional-dependencies]
automation = ["pyautogui>=0.9.54", "pynput>=1.7.6", "playwright>=1.40"]
vlm = ["requests>=2.31"]
speech = ["faster-whisper>=1.0"]
gui = ["uvicorn[standard]>=0.24", "fastapi>=0.104", "sse-starlette>=1.8"]
all = ["meeting-agent[automation,vlm,speech,gui]"]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "httpx>=0.25",
]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
