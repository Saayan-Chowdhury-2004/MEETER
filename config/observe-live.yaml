# Live-observation profile: real-screen OBSERVE session.
# Lower FPS + throttled OCR to stay light alongside a meeting.
agent:
  mode: observe
  data_dir: data
  emergency_stop: false

capture:
  source: monitor
  monitor: 1
  fps: 1                     # capture rate while a meeting is active

meeting:
  enabled: true
  poll_interval_idle: 2.0
  poll_interval_active: 5.0

memory:
  ring_buffer_seconds: 60
  persist_frames: false

regions:
  - name: full_screen
    box: [0.0, 0.0, 1.0, 1.0]
    priority: medium
    polling_hz: 0.5   # OCR at most every 2 s even if the screen keeps changing

change_detection:
  method: pixel_ratio
  threshold: 0.002
  noise_band: 25
  min_region_area: 0.0005

ocr:
  enabled: true
  provider: paddle
  language: en

url_detection:
  deduplicate: true

grounding:
  provider: ocr

vlm:
  enabled: false
  provider: mock
  model: qwen3-vl
  host: http://127.0.0.1:11434
  confidence_threshold: 0.95
  timeout_seconds: 30

rules:
  file: config/rules.yaml

policy:
  require_confirmation_for_unknown_domains: true
  allow_form_submission: false
  allow_file_deletion: false
  allow_shell_commands: false
  confidence_threshold: 0.95
  max_action_retries: 1
  mode_capabilities:
    observe: []
    suggest: []
    assist: [open_url, switch_window, open_application, scroll]
    autonomous: [open_url, click, type_text, key_press, scroll, open_application, switch_window, copy_text]
  blocked_actions:
    - submit_form
    - delete_file
    - execute_shell
    - send_email
    - purchase
    - account_setting_change
  allowed_domains:
    - github.com
    - docs.google.com
    - forms.google.com
    - drive.google.com
    - notion.so
  blocked_domains: []
  allowed_apps:
    vscode:
      paths: ["code", "code.cmd"]
    browser:
      paths: []
    calculator:
      paths: ["calc.exe"]
    notepad:
      paths: ["notepad.exe"]
    file_explorer:
      paths: ["explorer.exe"]
  url_shorteners:
    - bit.ly
    - tinyurl.com
    - t.co
    - goo.gl
    - is.gd
    - cutt.ly

automation:
  enabled: false        # OBSERVE session: nothing may touch mouse/keyboard
  browser: default
  dry_run: true

speech:
  enabled: false
  model: base.en
  device: cpu

kill_switch:
  hotkey: ctrl+alt+shift+m

api:
  host: 127.0.0.1
  port: 8765

logging:
  level: INFO
  file: data/agent.log
